<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Declared Pace — walkthrough</title>
<meta property="og:title" content="Declared Pace — walkthrough" />
<meta property="og:description" content="A five-minute walkthrough of a Toggl Focus week-one prototype." />
<meta property="og:type" content="video.other" />
<style>
  :root{
    --bg:#f5f5f5; --surface:#ffffff; --ink:#131213; --ink-2:#575456; --ink-3:#b3b0b2;
    --line:#e9e8e8; --accent:#a84c9d;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#131213; --surface:#1c1a1c; --ink:#ffffff; --ink-2:#b3b0b2; --ink-3:#827f81;
      --line:#3c393b; --accent:#c282b9;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:400 14px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:clamp(1rem,4vw,3rem);
  }
  main{width:100%;max-width:64rem;display:flex;flex-direction:column;gap:1.25rem}
  header{display:flex;flex-direction:column;gap:.35rem}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0}
  h1{margin:0;font-size:clamp(1.5rem,3.5vw,2rem);line-height:1.15;letter-spacing:-.03em;font-weight:600}
  p{margin:0;color:var(--ink-2);max-width:60ch}
  video{width:100%;border:1px solid var(--line);border-radius:8px;background:#000;display:block}
  nav{display:flex;flex-wrap:wrap;gap:.6rem;padding-top:.25rem}
  a{
    display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;
    padding:.45rem .8rem;font-size:13px;font-weight:500;color:var(--ink);
    text-decoration:none;background:var(--surface);transition:background .15s cubic-bezier(.4,0,.2,1);
  }
  a:hover{background:var(--bg)}
  a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  small{color:var(--ink-3);font-size:12.5px}
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Toggl home assignment · Martín Zulueta</p>
    <h1>Declared Pace — walkthrough</h1>
    <p>A week-one prototype for Toggl Focus, and the reasoning behind it.</p>
  </header>

  <video controls preload="metadata" playsinline>
    <source src="./walkthrough.mp4" type="video/mp4" />
    Your browser cannot play this video.
    <a href="./walkthrough.mp4">Download it instead</a>.
  </video>

  <nav>
    <a class="primary" href="./">Open the prototype</a>
    <a href="https://github.com/martinzg16/toggl-w0-prototype">Source</a>
    <a href="https://github.com/martinzg16/toggl-w0-prototype/blob/main/PRD.md">PRD</a>
    <a href="https://github.com/martinzg16/toggl-w0-prototype/blob/main/SPEC.md">Spec</a>
  </nav>
  <small>Trouble playing it? <a href="./walkthrough.mp4" style="border:0;padding:0;background:none;text-decoration:underline">Direct download</a>.</small>
</main>
</body>
</html>
